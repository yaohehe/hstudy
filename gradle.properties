# 注意：本机专属的 -Djava.io.tmpdir 覆盖已移到 %GRADLE_USER_HOME%/gradle.properties，
# 提交进仓库会让 Linux CI runner 因该目录不存在而无法启动 Gradle。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# kotlin.mpp.enableCInteropCommonization 会退回 Kotlin 2.1 已移除的旧 commonizer，
# iOS 目标的共享 source set 由内置 commonizer 处理，不要加回。
kotlin.native.ignoreDisabledTargets=true
# Kotlin 2.1.20 的 native toolchain 会让 kspKotlinIos* 以 in-process 方式加载
# org.jetbrains.kotlin.cli.utilities.MainKt 并抛 ClassNotFoundException；
# 关闭后回退到 ~/.konan 发行包工具链，iOS 目标才能真正进入编译。
kotlin.native.toolchain.enabled=false
org.gradle.configuration-cache=false
