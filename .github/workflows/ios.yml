name: iOS Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Xcode version
        run: xcodebuild -version && xcrun simctl list runtimes | grep -i ios || true
      - name: Build Kotlin framework for iOS Simulator
        # gradle.properties 里 kotlin.native.toolchain.enabled=false：
        # 走 legacy 的 ~/.konan 工具链，避免 kspKotlinIos* 以 in-process 方式加载
        # org.jetbrains.kotlin.cli.utilities.MainKt 时的 ClassNotFoundException。
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace
      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: actions/upload-artifact@v4
        with:
          name: HStudy-ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app
      - name: Smoke test on simulator (install + launch + liveness/exception gate)
        # 回归闸门（task 46）：证明 .app 能装能起，且启动后不因未捕获异常崩溃。
        # 本轮修复：Info.plist 缺 CADisableMinimumFrameDurationOnPhone → Compose PlistSanityCheck
        # 抛未捕获 Kotlin 异常 → SIGABRT（约启动后 60s，延迟自检触发）；这里同时断言之。
        # 语义：模拟器基础设施抖动（无设备/装不上）判 SKIP、不红；App 真崩了才红。
        run: |
          set -e
          # 直接用 runner 上已存在的可用模拟器：devicetypes/runtimes 的 JSON 形状随 Xcode 版本变化，
          # 解析键名不可靠，这里退化为文本列表里第一个 iPhone 设备的 UDID。
          UDID=$(xcrun simctl list devices available | grep -m1 iPhone | grep -Eo '[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}')
          if [ -z "$UDID" ]; then echo "SMOKE_RESULT=SKIP (no simulator device)"; exit 0; fi
          echo "simulator=$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || echo "SMOKE: boot returned non-zero (device may already be booted)"
          APP=$(find build/ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          if ! xcrun simctl install "$UDID" "$APP"; then echo "SMOKE_RESULT=SKIP (install failed: infra)"; exit 0; fi
          # 断言打包进 .app 的 Info.plist 带修复键（防止 plist 未参与构建或被覆盖）
          plutil -p "$APP/Info.plist" > app_infoplist.txt 2>&1 || true
          PLIST_OK=1
          if grep -q 'CADisableMinimumFrameDurationOnPhone' app_infoplist.txt; then
            echo "SMOKE_CHECK: plist key present"
          else
            echo "SMOKE_FAIL: built Info.plist missing CADisableMinimumFrameDurationOnPhone"; PLIST_OK=0
          fi
          OBSERVE=95
          # --console-pty 捕获 App 自身 stderr（Kotlin/Native 未捕获异常先打印栈再 abort）
          ( xcrun simctl launch --console-pty "$UDID" com.hstudy.app.ios > app_console.log 2>&1 ) &
          CONSOLE_JOB=$!
          # PID 走宿主进程名：--console-pty 会把 simctl 自己的 "bundleid: pid" 行缓冲到末尾，解析 app_console.log 不可靠。
          PID=""
          for _try in $(seq 1 20); do
            PID=$(pgrep -x iosApp | head -1 || true)
            [ -n "$PID" ] && break
            sleep 1
          done
          APP_LAUNCHED=0
          [ -n "$PID" ] && APP_LAUNCHED=1
          echo "host_pid=$PID launched=$APP_LAUNCHED"
          # 逐秒记录存活/死亡（宿主 ps 才权威；launchctl list 会留陈旧条目）
          if [ "$APP_LAUNCHED" = "1" ]; then
            (
              for i in $(seq 1 "$OBSERVE"); do
                if ps -p "$PID" >/dev/null 2>&1; then
                  echo "t=${i}s ALIVE $(ps -p "$PID" -o stat=,etime= | tr -s ' ')"
                else
                  echo "t=${i}s DEAD (ps no longer lists pid $PID)"
                  break
                fi
                sleep 1
              done
            ) > liveness.log 2>&1 &
            LIVE_PID=$!
          else
            echo "PID empty; app did not launch" > liveness.log
          fi
          sleep "$OBSERVE"
          [ -n "${LIVE_PID:-}" ] && { wait "$LIVE_PID" 2>/dev/null || true; }
          wait "$CONSOLE_JOB" 2>/dev/null || true
          echo "=== liveness (host ps) ==="
          cat liveness.log
          xcrun simctl io "$UDID" screenshot smoke.png
          ls -la smoke.png
          # 定向抓终止原因：旧版宽 grep+tail 被 nsurlsessiond 噪声淹没，这里改用 bundle id / SpringBoard 谓词
          {
            echo "=== predicate: eventMessage CONTAINS bundle id ==="
            xcrun simctl spawn "$UDID" log show --style compact --last 2m \
              --predicate 'eventMessage CONTAINS "com.hstudy.app.ios"' 2>&1 | tail -120
            echo "=== predicate: SpringBoard terminate/exit/jetsam/watchdog ==="
            xcrun simctl spawn "$UDID" log show --style compact --last 2m \
              --predicate 'process == "SpringBoard" AND (eventMessage CONTAINS[c] "terminat" OR eventMessage CONTAINS[c] "exit" OR eventMessage CONTAINS[c] "jetsam" OR eventMessage CONTAINS[c] "watchdog")' 2>&1 | tail -80
          } > app_unified.log 2>&1 || true
          echo "=== unified log (tail 60) ==="
          tail -60 app_unified.log
          # 崩溃/jetsam 报告：去掉 maxdepth 限制并加 jetsam 名字，旧版 maxdepth 3 可能漏
          find "$HOME/Library/Logs/DiagnosticReports" \
               "$HOME/Library/Developer/CoreSimulator/Devices/$UDID" \
               \( -name '*.ips' -o -name '*jetsam*' -o -name 'Crash*' \) 2>/dev/null > crashlist.txt || true
          echo "=== crash/jetsam report paths (empty means none) ==="
          cat crashlist.txt
          # 把崩溃报告内容 cat 进 artifact（上一版只传路径，backtrace 丢了，这是 SIGABRT 定位的关键）
          : > crashreport_content.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            { echo "===== $f ====="; cat "$f"; } >> crashreport_content.txt 2>&1 || true
          done < crashlist.txt
          echo "=== crash report content (head 200) ==="
          head -200 crashreport_content.txt || true
          echo "=== app console (head 300) ==="
          head -300 app_console.log || true
          if [ -n "${LIVE_PID:-}" ]; then echo "=== liveness (host ps) ==="; cat liveness.log; fi
          # 硬断言：只有"确实启动过"才判定成败；未启动 = 模拟器基础设施抖动，SKIP 不红。
          SMOKE_FAIL=0
          [ "$PLIST_OK" = "1" ] || SMOKE_FAIL=1
          if [ "$APP_LAUNCHED" = "1" ]; then
            if grep -q "Uncaught Kotlin exception" app_console.log; then
              echo "SMOKE_FAIL: uncaught Kotlin exception present in app console"; SMOKE_FAIL=1
            fi
            if ps -p "$PID" >/dev/null 2>&1; then
              echo "SMOKE_CHECK: app still ALIVE after ${OBSERVE}s"
            else
              echo "SMOKE_FAIL: app died within ${OBSERVE}s"; SMOKE_FAIL=1
            fi
          else
            echo "SMOKE_SKIP: app did not launch — treating as infra, not failing"
          fi
          xcrun simctl terminate "$UDID" com.hstudy.app.ios || echo "SMOKE: terminate skipped (process already gone)"
          xcrun simctl shutdown "$UDID" || true
          if [ "$SMOKE_FAIL" = "1" ]; then echo "SMOKE_RESULT=FAIL"; exit 1; else echo "SMOKE_RESULT=PASS"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HStudy-ios-simulator-smoke
          path: |
            smoke.png
            app_console.log
            app_infoplist.txt
            liveness.log
            app_unified.log
            crashlist.txt
            crashreport_content.txt