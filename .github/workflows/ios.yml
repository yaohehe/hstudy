name: iOS Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Xcode version
        run: xcodebuild -version && xcrun simctl list runtimes | grep -i ios || true
      - name: Probe Kotlin/Native toolchain switches
        # 临时诊断：kspKotlinIosSimulatorArm64 以 in-process 方式加载
        # org.jetbrains.kotlin.cli.utilities.MainKt 时抛 ClassNotFoundException，
        # 该类的来源由下面这些开关决定（embeddable jar / native toolchain / 发行包来源 / 编译器守护进程）。
        # 逐个试出能让 ios 目标真正编译的组合，胜出者写进 KOTLIN_NATIVE_PROBE_FLAGS。
        run: |
          for F in "-Pkotlin.native.useEmbeddableCompilerJar=false" \
                   "-Pkotlin.native.toolchain.enabled=false" \
                   "-Pkotlin.native.distribution.downloadFromMaven=false" \
                   "-Pkotlin.native.disableCompilerDaemon=true"; do
            echo "::group::probe $F"
            if ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --no-daemon $F; then
              echo "### PASS $F"
              echo "KOTLIN_NATIVE_PROBE_FLAGS=$F" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::endgroup::"
          done
          echo "所有候选开关组合都无法编译 iOS"
          exit 1
      - name: Build Kotlin framework for iOS Simulator
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon $KOTLIN_NATIVE_PROBE_FLAGS
      - name: Dump Kotlin/Native distribution on failure
        if: failure()
        run: |
          echo "=== ~/.konan ==="
          ls -la "$HOME/.konan" || true
          echo "=== dist top level ==="
          ls -la "$HOME/.konan"/*/ || true
          echo "=== jars ==="
          find "$HOME/.konan" -name "*.jar" | head -80 || true
          echo "=== tools dir ==="
          find "$HOME/.konan" -maxdepth 3 -type d -name tools -exec ls -la {} \; || true
      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: actions/upload-artifact@v4
        with:
          name: HStudy-ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app