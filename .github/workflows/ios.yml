name: iOS Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Xcode version
        run: xcodebuild -version && xcrun simctl list runtimes | grep -i ios || true
      - name: Build Kotlin framework for iOS Simulator
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: actions/upload-artifact@v4
        with:
          name: HStudy-ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app