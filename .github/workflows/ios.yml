name: iOS Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Xcode version
        run: xcodebuild -version && xcrun simctl list runtimes | grep -i ios || true
      - name: Build Kotlin framework for iOS Simulator
        # gradle.properties 里 kotlin.native.toolchain.enabled=false：
        # 走 legacy 的 ~/.konan 工具链，避免 kspKotlinIos* 以 in-process 方式加载
        # org.jetbrains.kotlin.cli.utilities.MainKt 时的 ClassNotFoundException。
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace
      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: actions/upload-artifact@v4
        with:
          name: HStudy-ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app
      - name: Smoke test on simulator (install + launch + screenshot)
        # 冒烟验证：证明 .app 在模拟器里真的能装能起，而不是只完成链接。
        # 模拟器启动有偶发失败，故不阻塞发布闸门，只留证据与截图工件。
        continue-on-error: true
        run: |
          set -e
          # 直接用 runner 上已存在的可用模拟器：devicetypes/runtimes 的 JSON 形状随 Xcode 版本变化，
          # 解析键名不可靠，这里退化为文本列表里第一个 iPhone 设备的 UDID。
          UDID=$(xcrun simctl list devices available | grep -m1 iPhone | grep -Eo '[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}')
          test -n "$UDID"
          echo "simulator=$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || echo "SMOKE: boot returned non-zero (device may already be booted)"
          APP=$(find build/ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          xcrun simctl install "$UDID" "$APP"
          # 诊断版 v2（iOS SIGABRT 崩溃排查，systematic-debugging Phase 1）：只采证据，不改 App、不改阻塞性。
          # 上一版已证实退出是 SIGABRT(6)（进程自 abort，非 watchdog），但只上传了崩溃报告路径、丢了 backtrace。
          # 这一版补两件：(a) --console-pty 捕获 App 自身 stdout/stderr——Kotlin/Native 未捕获异常会先打印
          # "Uncaught Kotlin exception:" + 栈到 stderr 再 abort；(b) 把 .ips 崩溃报告内容 cat 进 artifact。
          # 模拟器 App 是 macOS 宿主进程，host ps 才权威（launchctl list 已被证明会留陈旧条目）。
          ( xcrun simctl launch --console-pty "$UDID" com.hstudy.app.ios > app_console.log 2>&1 ) &
          CONSOLE_JOB=$!
          # 等 launch 打印出 "com.hstudy.app.ios: <pid>" 行再取宿主 PID
          PID=""
          for _try in 1 2 3 4 5 6 7 8; do
            PID=$(awk '/com\.hstudy\.app\.ios:/ {print $2; exit}' app_console.log 2>/dev/null)
            [ -n "$PID" ] && break
            sleep 1
          done
          echo "host_pid=$PID"
          # 逐秒记录存活/死亡与最后进程状态，定位精确死亡秒
          if [ -n "$PID" ]; then
            (
              for i in $(seq 1 45); do
                if ps -p "$PID" >/dev/null 2>&1; then
                  echo "t=${i}s ALIVE $(ps -p "$PID" -o stat=,etime= | tr -s ' ')"
                else
                  echo "t=${i}s DEAD (ps no longer lists pid $PID)"
                  break
                fi
                sleep 1
              done
            ) > liveness.log 2>&1 &
            LIVE_PID=$!
          else
            echo "PID empty; --console-pty launch may have failed" > liveness.log
          fi
          sleep 45
          [ -n "${LIVE_PID:-}" ] && { wait "$LIVE_PID" 2>/dev/null || true; }
          wait "$CONSOLE_JOB" 2>/dev/null || true
          echo "=== liveness (host ps) ==="
          cat liveness.log
          xcrun simctl io "$UDID" screenshot smoke.png
          ls -la smoke.png
          # 定向抓终止原因：旧版宽 grep+tail 被 nsurlsessiond 噪声淹没，这里改用 bundle id / SpringBoard 谓词
          {
            echo "=== predicate: eventMessage CONTAINS bundle id ==="
            xcrun simctl spawn "$UDID" log show --style compact --last 2m \
              --predicate 'eventMessage CONTAINS "com.hstudy.app.ios"' 2>&1 | tail -120
            echo "=== predicate: SpringBoard terminate/exit/jetsam/watchdog ==="
            xcrun simctl spawn "$UDID" log show --style compact --last 2m \
              --predicate 'process == "SpringBoard" AND (eventMessage CONTAINS[c] "terminat" OR eventMessage CONTAINS[c] "exit" OR eventMessage CONTAINS[c] "jetsam" OR eventMessage CONTAINS[c] "watchdog")' 2>&1 | tail -80
          } > app_unified.log 2>&1 || true
          echo "=== unified log (tail 60) ==="
          tail -60 app_unified.log
          # 崩溃/jetsam 报告：去掉 maxdepth 限制并加 jetsam 名字，旧版 maxdepth 3 可能漏
          find "$HOME/Library/Logs/DiagnosticReports" \
               "$HOME/Library/Developer/CoreSimulator/Devices/$UDID" \
               \( -name '*.ips' -o -name '*jetsam*' -o -name 'Crash*' \) 2>/dev/null > crashlist.txt || true
          echo "=== crash/jetsam report paths (empty means none) ==="
          cat crashlist.txt
          # 把崩溃报告内容 cat 进 artifact（上一版只传路径，backtrace 丢了，这是 SIGABRT 定位的关键）
          : > crashreport_content.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            { echo "===== $f ====="; cat "$f"; } >> crashreport_content.txt 2>&1 || true
          done < crashlist.txt
          echo "=== crash report content (head 200) ==="
          head -200 crashreport_content.txt || true
          echo "=== app console (head 200) ==="
          head -200 app_console.log || true
          xcrun simctl terminate "$UDID" com.hstudy.app.ios || echo "SMOKE: terminate skipped (process already gone)"
          xcrun simctl shutdown "$UDID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HStudy-ios-simulator-smoke
          path: |
            smoke.png
            app_console.log
            liveness.log
            app_unified.log
            crashlist.txt
            crashreport_content.txt