name: iOS Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Xcode version
        run: xcodebuild -version && xcrun simctl list runtimes | grep -i ios || true
      - name: Build Kotlin framework for iOS Simulator
        # gradle.properties 里 kotlin.native.toolchain.enabled=false：
        # 走 legacy 的 ~/.konan 工具链，避免 kspKotlinIos* 以 in-process 方式加载
        # org.jetbrains.kotlin.cli.utilities.MainKt 时的 ClassNotFoundException。
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace
      - name: Dump Kotlin/Native distribution on failure
        if: failure()
        run: |
          echo "=== ~/.konan ==="
          ls -la "$HOME/.konan" || true
          echo "=== dist top level ==="
          ls -la "$HOME/.konan"/*/ || true
          echo "=== jars ==="
          find "$HOME/.konan" -name "*.jar" | head -80 || true
          echo "=== tools dir ==="
          find "$HOME/.konan" -maxdepth 3 -type d -name tools -exec ls -la {} \; || true
          echo "=== 从 platform klib 里提取 UIKit/UserNotifications 的真实符号名 ==="
          for f in $(find "$HOME/.konan" -name "*.klib" -path "*ios_simulator_arm64*" \
                       \( -name "*uikit*" -o -name "*user-notifications*" -o -name "*notification*" \) | head -4); do
            echo "-- $f"
            unzip -p "$f" 2>/dev/null | tr -cd '[:print:]\n' \
              | grep -o -E "UIModalPresentation[A-Za-z]+|setValuesForKeysWithDictionary|setValue:forKey|popoverPresentationController" \
              | sort -u | head -40 || true
          done
      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: actions/upload-artifact@v4
        with:
          name: HStudy-ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app