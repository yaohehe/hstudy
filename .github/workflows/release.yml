name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  # 发布构建不互相取消：同一 tag 的重跑与并发发布都需完整执行
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build release APK (signed)
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease --no-daemon
      - name: Decode legacy debug keystore (v2 signing key, for rotation lineage)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
      - name: Rotate signing key (v2 debug → release lineage, v3.2.1+)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=$(find composeApp/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" rotate \
            --old-signer --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey \
            --new-signer --ks "$RUNNER_TEMP/release.jks" --ks-pass pass:"$RELEASE_KEYSTORE_PASSWORD" --key-pass pass:"$RELEASE_KEY_PASSWORD" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --out "$RUNNER_TEMP/lineage.bin"
          # rotation-min-sdk-version 28：新 key 进原始 v3 块（Android 9+）；默认值只进 v3.1（13+），
          # 会断掉 Android 9–12 已装 v3.x 设备的升级（2026-11-20 本地实证）。
          # 第一 signer=旧 debug key 供 v1/v2 块（Android 8.x 的 v2 设备凭签名一致直接升级）。
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey \
            --next-signer --ks "$RUNNER_TEMP/release.jks" --ks-pass pass:"$RELEASE_KEYSTORE_PASSWORD" --key-pass pass:"$RELEASE_KEY_PASSWORD" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --lineage "$RUNNER_TEMP/lineage.bin" \
            --min-sdk-version 26 --rotation-min-sdk-version 28 \
            --out "$RUNNER_TEMP/rotated.apk" "$APK"
          mv "$RUNNER_TEMP/rotated.apk" "$APK"
      - name: Verify APK signature (v2 block = legacy debug key, v3 block = release key)
        run: |
          APK=$(find composeApp/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify -v "$APK"
          "$APKSIGNER" verify --min-sdk-version 26 --max-sdk-version 27 --print-certs "$APK" | grep -q 254912536bf42a735846cd20bb2d68733f99e3a11b2298daa920057b42374d3d
          "$APKSIGNER" verify --min-sdk-version 28 --max-sdk-version 32 --print-certs "$APK" | grep -q 703e29910fd1f41769f1bc349344e5d98da1c41e693b4c4a54a58c0ca5fe2f00
      - name: Stage APK
        run: |
          mkdir -p dist
          APK=$(find composeApp/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" dist/HStudy-${{ github.ref_name }}-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*.apk

  ios-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Stage simulator app bundle
        run: |
          mkdir -p dist
          APP=$(find build/ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          ditto -c -k --sequesterRsrc "$APP" "dist/HStudy-${{ github.ref_name }}-ios-simulator-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/*.zip

  publish:
    needs: [android-release, ios-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'release-*'
          path: assets
          merge-multiple: true
      - name: List staged assets
        run: ls -la assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            HStudy ${{ github.ref_name }} — Android + iOS 跨平台版本。
            - `*-signed.apk`：已签名的 Android release 包，可直接侧载安装（需在系统中允许"未知来源"）；
              v3.2.1 起含签名密钥轮换：装过 v2（debug 签名）或 v3.x（Android 9+）的设备可不卸载直接覆盖升级；
              Android 8.x 且已装 v3.0–v3.2.0 的设备需导出备份→卸载→安装→恢复。
            - `*-ios-simulator-unsigned.zip`：iOS 模拟器 .app 包（无 Apple 开发者证书，未签名）。
              真机安装需 Apple Developer Program 会员与签名证书。
