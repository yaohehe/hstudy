name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  # 发布构建不互相取消：同一 tag 的重跑与并发发布都需完整执行
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Build release APK (unsigned)
        run: ./gradlew :composeApp:assembleRelease --no-daemon
      - name: Stage APK
        run: |
          mkdir -p dist
          cp composeApp/build/outputs/apk/release/*.apk dist/HStudy-${{ github.ref_name }}-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*.apk

  ios-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Build iOS app (simulator, unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Stage simulator app bundle
        run: |
          mkdir -p dist
          APP=$(find build/ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          ditto -c -k --sequesterRsrc "$APP" "dist/HStudy-${{ github.ref_name }}-ios-simulator-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/*.zip

  publish:
    needs: [android-release, ios-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'release-*'
          path: assets
          merge-multiple: true
      - name: List staged assets
        run: ls -la assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            HStudy ${{ github.ref_name }} — Android + iOS 跨平台版本。
            - `*-unsigned.apk`：未签名 Android release 包；正式分发请用本地签名流程（见 README）。
            - `*-ios-simulator-unsigned.zip`：iOS 模拟器 .app 包（无 Apple 开发者证书，未签名）。
              真机安装 / TestFlight 需用 Xcode + Apple 开发者账号重新归档签名。
